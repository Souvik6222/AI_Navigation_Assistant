buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Fix: CameraX transitively pulls kotlin-stdlib-jdk7/jdk8 which clash with newer stdlib
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

apply plugin: 'com.android.application'

android {
    namespace 'com.navigation.assistant'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.navigation.assistant'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -march=armv8-a+fp+simd'
                abiFilters 'arm64-v8a'
                arguments "-DOpenCV_DIR=${project.rootDir}/../third_party/android/OpenCV-android-sdk/sdk/native/jni",
                          "-DONNXRUNTIME_ROOT=${project.rootDir}/../third_party/android/onnxruntime-android"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // CameraX
    def camerax_version = '1.3.1'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Required for CameraX ListenableFuture (avoids Kotlin stdlib clash from full guava)
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
}
